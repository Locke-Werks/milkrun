warning = "Rendering needs a GPU that can encode HEVC. NVIDIA goes through NVENC; AMD and Intel go through Media Foundation."

# No presets ship with this: the library is community content under its own
# terms. The folder is created so the app has somewhere to look, and its
# README says where to get them.

[[options]]
id    = "desktop_shortcut"
label = "Put a shortcut on the desktop"

[[actions]]
type = "shortcut"
target = "{app}\\MilkRun.exe"
name = "Milk Run"

[[actions]]
type = "shortcut"
target = "{app}\\MilkRun.exe"
where = "desktop"
name = "Milk Run"
when = "desktop_shortcut"

[[actions]]
type = "arp"
