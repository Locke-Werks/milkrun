[product]
name         = "Milk Run"
version      = "0.2.0"
publisher    = "Locke Werks"
description  = "Renders a MilkDrop preset to video, in sync with a song"
copyright    = "Copyright (c) Locke Werks. Based on MilkDrop 3 by milkdrop2077 and BeatDrop by Maxim Volskiy. BSD 3-Clause."
url          = "https://github.com/Locke-Werks/milkrun"
icon         = "..\\assets\\milkrun.ico"
upgrade_code = "b7c41f92-3d5a-4e18-9a6c-2f8e1d4b7a03"
aumid        = "LockeWerks.MilkRun"

[install]
scope = "machine"
dir   = "{pf}\\Milk Run"

